{# 后台唯一的 HTML：一个壳 + /api/admin/view。

   robots 一律 noindex,nofollow（robots.txt 里那条 Disallow 之外的第二道），
   而且这里没有 #nojs 那份服务端内容 —— 后台本来就不给爬虫看。
   主题首帧那段脚本与前台 shell.html 完全一致：同一个 localStorage 键、
   同一对 <html> 属性，所以前后台共用一个亮/暗选择。 #}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <script>
    (function () {
      var d = document.documentElement;
      d.classList.add('js');
      var t = 'system';
      try { t = localStorage.getItem('heroui-theme') || 'system'; } catch (e) { }
      if (t !== 'light' && t !== 'dark') t = 'system';
      var r = t === 'system'
        ? (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        : t;
      d.classList.add(r);
      d.setAttribute('data-theme', r);
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>后台统计 - 追剧资源搜索</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>📊</text></svg>">
  <link rel="stylesheet" href="{{ url_for('static', filename='spa/app.css') }}?v={{ asset_v }}">
</head>
<body>
  <div id="app"></div>
  <script id="boot-data" type="application/json">{{ boot | tojson }}</script>
  <script type="module" src="{{ url_for('static', filename='spa/admin.js') }}?v={{ asset_v }}"></script>
</body>
</html>
